name: Check repository
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check extension syntax
        run: |
          git ls-files -z 'agent/extensions/*.ts' | xargs -0 -n1 node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { stripTypeScriptTypes } from "node:module";
            import { spawnSync } from "node:child_process";
            const input = stripTypeScriptTypes(readFileSync(process.argv[1], "utf8"));
            process.exit(spawnSync(process.execPath, ["--input-type=module", "--check"], { input, stdio: ["pipe", "inherit", "inherit"] }).status ?? 1);
          '
      - name: Reject tracked pi runtime data
        run: |
          if git ls-files agent | grep -Ev '^agent/(extensions|agents)/'; then
            echo 'Unexpected file in pi home' >&2
            exit 1
          fi
